<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSTA Job Portal - Starting React App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --osta-green: #228B22;
            --osta-dark: #2C3E50;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--osta-green) 0%, var(--osta-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .loading-container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .btn-fallback {
            background: white;
            color: var(--osta-green);
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 25px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .btn-fallback:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            color: var(--osta-green);
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <h1><i class="fas fa-briefcase me-2"></i>OSTA Job Portal</h1>
        <p class="mb-4">Starting React application...</p>
        
        <div id="redirect-message">
            <p>If you're not redirected automatically:</p>
            <a href="http://localhost:3000" class="btn-fallback">
                <i class="fas fa-external-link-alt me-1"></i>Open React App
            </a>
            <a href="login.php" class="btn-fallback">
                <i class="fas fa-sign-in-alt me-1"></i>Direct Login
            </a>
        </div>
    </div>

    <script>
        // Auto-redirect to React dev server
        setTimeout(function() {
            window.location.href = 'http://localhost:3000';
        }, 2000);
        
        // Show manual options after 5 seconds
        setTimeout(function() {
            document.getElementById('redirect-message').style.display = 'block';
        }, 5000);
    </script>
</body>
</html>
